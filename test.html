<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>print-labels unit tests</title>
    <style>
      body { font-family: -apple-system, sans-serif; padding: 20px; }
      .pass { color: #2d6a4f; }
      .fail { color: #b42318; font-weight: bold; }
      pre { background: #f4f5f7; padding: 8px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>print-labels — Layout unit tests</h1>
    <p id="summary">running…</p>
    <pre id="out"></pre>

    <script src="formats.js"></script>
    <script src="app.js"></script>
    <script>
      (function () {
        const out = document.getElementById("out");
        const summary = document.getElementById("summary");
        let passed = 0, failed = 0;
        function assert(name, cond, detail) {
          if (cond) { passed++; out.textContent += "✓ " + name + "\n"; }
          else {
            failed++;
            out.textContent += "✗ FAIL: " + name + (detail ? "  → " + detail : "") + "\n";
          }
        }
        function approx(a, b) { return Math.abs(a - b) < 0.0001; }

        const L = window.PrintLabels.Layout;
        const F = window.FORMATS;

        // Wait for DOMContentLoaded to have run UI.init (harmless here).
        document.addEventListener("DOMContentLoaded", function () {
          const fmt5027 = F["5027"];

          // slotPosition: slot 0 top-left = (marginLeft, marginTop)
          let p = L.slotPosition(fmt5027, 0);
          assert("5027 slot 0 x = 10.0", approx(p.x_mm, 10.0), "got " + p.x_mm);
          assert("5027 slot 0 y = 6.0", approx(p.y_mm, 6.0), "got " + p.y_mm);

          // slot 5 = start of row 1 → x resets to 10, y += pitchY (21.2)
          p = L.slotPosition(fmt5027, 5);
          assert("5027 slot 5 x = 10.0", approx(p.x_mm, 10.0), "got " + p.x_mm);
          assert("5027 slot 5 y = 27.2", approx(p.y_mm, 6.0 + 21.2), "got " + p.y_mm);

          // slot 1 = col 1 → x += pitchX (39.5 manual override)
          p = L.slotPosition(fmt5027, 1);
          assert("5027 slot 1 x = 49.5 (manual pitchX)", approx(p.x_mm, 10.0 + 39.5), "got " + p.x_mm);

          // Calibration offsets: optional 3rd arg { x, y } shifts every slot.
          // Omitting it (backward compat) leaves positions unchanged.
          p = L.slotPosition(fmt5027, 0);
          assert("5027 slot 0 no offsets still x = 10.0", approx(p.x_mm, 10.0), "got " + p.x_mm);
          p = L.slotPosition(fmt5027, 0, { x: 2, y: -1 });
          assert("5027 slot 0 +offset(2,-1) x = 12.0", approx(p.x_mm, 12.0), "got " + p.x_mm);
          assert("5027 slot 0 +offset(2,-1) y = 5.0", approx(p.y_mm, 5.0), "got " + p.y_mm);
          // Offset applies uniformly to every slot, not just slot 0.
          p = L.slotPosition(fmt5027, 5, { x: 2, y: -1 });
          assert("5027 slot 5 +offset(2,-1) x = 12.0", approx(p.x_mm, 12.0), "got " + p.x_mm);
          assert("5027 slot 5 +offset(2,-1) y = 26.2", approx(p.y_mm, 6.0 + 21.2 - 1), "got " + p.y_mm);
          // Offset composes with the existing pitchX override (slot 1 → 49.5 + 2).
          p = L.slotPosition(fmt5027, 1, { x: 2, y: 0 });
          assert("5027 slot 1 +offset(2,0) x = 51.5", approx(p.x_mm, 10.0 + 39.5 + 2), "got " + p.x_mm);

          // 4336 manual pitch overrides
          const fmt4336 = F["4336"];
          p = L.slotPosition(fmt4336, 1);
          assert("4336 slot 1 x = 49.25 (manual pitchX)", approx(p.x_mm, 10.0 + 39.25), "got " + p.x_mm);
          p = L.slotPosition(fmt4336, 5);
          assert("4336 slot 5 y = 19.78 (manual pitchY)", approx(p.y_mm, 2.0 + 17.78), "got " + p.y_mm);

          // pageOf: 65 slots per page → slot 65 starts page 1
          assert("5027 pageOf(0) = 0", L.pageOf(fmt5027, 0) === 0);
          assert("5027 pageOf(64) = 0", L.pageOf(fmt5027, 64) === 0);
          assert("5027 pageOf(65) = 1", L.pageOf(fmt5027, 65) === 1);
          assert("5027 slotsPerPage = 65", L.slotsPerPage(fmt5027) === 65);

          // fillSheet: basic pagination (slots now hold full items, not raws)
          const items = [
            { raw: { plant_name_swedish: "A" }, qty: 3, selected: true },
            { raw: { plant_name_swedish: "B" }, qty: 1, selected: true },
          ];
          const pages = L.fillSheet(fmt5027, items, 0);
          assert("fillSheet returns ≥1 page", pages.length >= 1);
          assert("page 0 has 65 slots", pages[0].length === 65);
          assert("page 0 slot 0 = first item", pages[0][0] && pages[0][0].raw && pages[0][0].raw.plant_name_swedish === "A");
          assert("page 0 slot 2 = third copy (A×3)", pages[0][2] && pages[0][2].raw && pages[0][2].raw.plant_name_swedish === "A");
          assert("page 0 slot 3 = item B", pages[0][3] && pages[0][3].raw && pages[0][3].raw.plant_name_swedish === "B");
          assert("page 0 slot 4 = null (empty)", pages[0][4] === null);

          // skip-N: first N slots blank
          const pagesSkip = L.fillSheet(fmt5027, items, 2);
          assert("skipN=2: slot 0 null", pagesSkip[0][0] === null);
          assert("skipN=2: slot 1 null", pagesSkip[0][1] === null);
          assert("skipN=2: slot 2 = first item", pagesSkip[0][2] && pagesSkip[0][2].raw && pagesSkip[0][2].raw.plant_name_swedish === "A");

          // expandItems respects selected + qty (returns full items now)
          const exp = L.expandItems([
            { raw: { n: "x" }, qty: 2, selected: true },
            { raw: { n: "y" }, qty: 5, selected: false },
          ]);
          assert("expandItems skips unselected", exp.length === 2 && exp[0].raw && exp[0].raw.n === "x");

          // Manual items: frozen `lines` bypass the field mapper.
          const RL = window.PrintLabels.resolveLines;
          const manualItem = {
            lines: [
              { text: "Tomat", sizePt: 7, bold: true },
              { text: "Vilma", sizePt: 6, bold: false },
              { text: "", sizePt: 6, bold: false },
              { text: "", sizePt: 6, bold: false },
            ],
            qty: 1, selected: true,
          };
          // Save mapping, set a conflicting mapping, confirm manual lines win.
          const S_old = window.PrintLabels.state.mapping;
          window.PrintLabels.state.mapping = [
            { path: "plant_name_swedish", sizePt: 9, bold: false, literal: "WRONG" },
            { path: "variety", sizePt: 9, bold: false, literal: "" },
            { path: "", sizePt: 9, bold: false, literal: "" },
            { path: "", sizePt: 9, bold: false, literal: "" },
          ];
          const manualLines = RL(manualItem);
          assert("manual item line1 = typed text", manualLines[0].text === "Tomat" && manualLines[0].bold === true);
          assert("manual item bypasses mapping (no WRONG)", manualLines[0].text !== "WRONG");
          assert("manual item line2 = typed text", manualLines[1].text === "Vilma");
          // Imported item still uses mapping when no frozen lines.
          const importedItem = { raw: { plant_name_swedish: "Sparris" }, qty: 1, selected: true };
          const importedLines = RL(importedItem);
          assert("imported item uses mapping literal", importedLines[0].text === "WRONG");
          window.PrintLabels.state.mapping = S_old;

          // Edit-in-place (P1-4): editing an imported item assigns frozen
          // `lines` (a verbatim override) and drops `raw`. resolveLines must
          // then return those lines directly, bypassing the mapper — even when
          // the mapper is later changed. This is the invariant saveManualItem
          // relies on when _editIndex is set.
          const editItem = { raw: { name: "Original" }, qty: 1, selected: true };
          const S_edit = window.PrintLabels.state.mapping;
          // Set a mapping that resolves name → "Original" so the prefill is
          // predictable (test.html doesn't call UI.init, so the default
          // mapping is empty and would otherwise yield blank lines here).
          window.PrintLabels.state.mapping = [
            { path: "name", sizePt: 7, bold: false, literal: "" },
            { path: "", sizePt: 6, bold: false, literal: "" },
            { path: "", sizePt: 6, bold: false, literal: "" },
            { path: "", sizePt: 6, bold: false, literal: "" },
          ];
          const prefill = RL(editItem);
          // Simulate what saveManualItem does: assign frozen lines (verbatim
          // override) and drop raw.
          editItem.lines = prefill.map((ln) => ({ text: ln.text + "!", sizePt: ln.sizePt, bold: ln.bold }));
          delete editItem.raw;
          // Switch to a conflicting mapping; the override must still win.
          window.PrintLabels.state.mapping = [
            { path: "", sizePt: 7, bold: false, literal: "SHOULD NOT APPEAR" },
            { path: "", sizePt: 6, bold: false, literal: "" },
            { path: "", sizePt: 6, bold: false, literal: "" },
            { path: "", sizePt: 6, bold: false, literal: "" },
          ];
          const overridden = RL(editItem);
          assert("edited imported item keeps frozen lines (override)", overridden[0].text === "Original!");
          assert("edited imported item ignores mapping", overridden[0].text !== "SHOULD NOT APPEAR");
          assert("edited imported item has no raw", editItem.raw === undefined);
          window.PrintLabels.state.mapping = S_edit;

          // Template-string literals: `{path}` tokens interpolate via resolvePath.
          // Missing → empty string; {{ / }} escape to a literal brace.
          const S_tpl = window.PrintLabels.state.mapping;
          const tplMap = (literal) => [
            { path: "name", sizePt: 7, bold: false, literal: literal },
            { path: "", sizePt: 6, bold: false, literal: "" },
            { path: "", sizePt: 6, bold: false, literal: "" },
            { path: "", sizePt: 6, bold: false, literal: "" },
          ];
          // Backward compat: literal without braces → verbatim.
          window.PrintLabels.state.mapping = tplMap("100% off");
          assert("plain literal unchanged", RL({ raw: { name: "X" } })[0].text === "100% off");
          // Literal still wins over path; template resolves within the literal.
          window.PrintLabels.state.mapping = tplMap("Hi {name}");
          assert("literal+token beats path", RL({ raw: { name: "Jo" } })[0].text === "Hi Jo");
          // Single token, literal prefix.
          window.PrintLabels.state.mapping = tplMap("Best by {date}");
          assert("single token", RL({ raw: { date: "2027-04" } })[0].text === "Best by 2027-04");
          // Two tokens.
          window.PrintLabels.state.mapping = tplMap("{first} {last}");
          assert("two tokens", RL({ raw: { first: "John", last: "Smith" } })[0].text === "John Smith");
          // Nested path token (whitespace around path is trimmed).
          window.PrintLabels.state.mapping = tplMap("{ growing.days } days");
          assert("nested token", RL({ raw: { growing: { days: 14 } } })[0].text === "14 days");
          // Missing token → empty (not literal).
          window.PrintLabels.state.mapping = tplMap("Hi {missing}");
          assert("missing token empty", RL({ raw: { name: "X" } })[0].text === "Hi ");
          // Escape: {{...}} → literal braces.
          window.PrintLabels.state.mapping = tplMap("{{not a token}}");
          assert("escape braces", RL({ raw: {} })[0].text === "{not a token}");
          // Mixed: real token + escaped brace pair in one string.
          window.PrintLabels.state.mapping = tplMap("Best by {date} ({{batch}})");
          assert("token + escape mixed", RL({ raw: { date: "2027-04" } })[0].text === "Best by 2027-04 ({batch})");
          window.PrintLabels.state.mapping = S_tpl;

          // Fields.discoverPaths
          const P = window.PrintLabels.Fields;
          const paths = P.discoverPaths([
            { a: 1, b: { c: 2 }, arr: [{ d: 3 }], empty: "" },
          ]);
          assert("discoverPaths finds top-level", paths.indexOf("a") !== -1);
          assert("discoverPaths finds nested", paths.indexOf("b.c") !== -1);
          assert("discoverPaths finds array[0]", paths.indexOf("arr[0].d") !== -1);
          assert("discoverPaths skips empty", paths.indexOf("empty") === -1);

          // parseCSV: RFC-4180-lite, header normalization, delimiter detection.
          const PC = window.PrintLabels.parseCSV;
          let csv = PC("a,b\n1,2\n3,4", ",");
          assert("csv basic headers", csv.headers.length === 2 && csv.headers[0] === "a" && csv.headers[1] === "b");
          assert("csv basic rows", csv.rows.length === 2 && csv.rows[0].a === "1" && csv.rows[0].b === "2" && csv.rows[1].a === "3");
          // Header normalization: spaces/dashes → "_", lowercased.
          csv = PC("Best Before,Item-Name\nx,y", ",");
          assert("csv normalizes headers", csv.headers[0] === "best_before" && csv.headers[1] === "item_name" && csv.rows[0].best_before === "x");
          // Auto-detect: comma, semicolon, tab each win on their own input.
          assert("csv auto comma", PC("a,b\n1,2", "").rows[0].a === "1");
          assert("csv auto semicolon", PC("a;b\n1;2", "").rows[0].a === "1");
          assert("csv auto tab", PC("a\tb\n1\t2", "").rows[0].a === "1");
          // Quoted field with embedded delimiter.
          csv = PC('a,b\n"hi, there",2', ",");
          assert("csv quoted comma", csv.rows[0].a === "hi, there" && csv.rows[0].b === "2");
          // Escaped quote inside quoted field.
          csv = PC('a\n"she said ""hi"""', ",");
          assert("csv escaped quote", csv.rows[0].a === 'she said "hi"');
          // Quoted field spanning a newline.
          csv = PC('a,b\n"line1\nline2",2', ",");
          assert("csv quoted newline", csv.rows[0].a === "line1\nline2" && csv.rows[0].b === "2");
          // Short row padded; trailing empty line dropped.
          csv = PC("a,b\n1\n", ",");
          assert("csv short row padded + trailing blank dropped", csv.rows.length === 1 && csv.rows[0].a === "1" && csv.rows[0].b === "");
          // Duplicate headers get _2, _3 suffixes.
          csv = PC("a,a\n1,2", ",");
          assert("csv dedup headers", csv.headers[0] === "a" && csv.headers[1] === "a_2" && csv.rows[0].a === "1" && csv.rows[0].a_2 === "2");
          // Empty / no-data input throws.
          let threw = false;
          try { PC("", ","); } catch (e) { threw = true; }
          assert("csv empty throws", threw);

          // fitText maxLines (P2-3): wrap mode budgets 2× the label width so
          // a long string keeps a larger font than nowrap, which must shrink
          // or truncate to one line. Both modes are bounded.
          const FT = window.PrintLabels.UI.LabelRender.fitText;
          // Clear the measurement cache so earlier runs don't mask changes.
          window.PrintLabels.UI.LabelRender._cache = new Map();
          const longText = "A very long address that should wrap or truncate";
          const W = 30; // mm budget per line
          const oneLine = FT(longText, 7, false, W, 1);
          const twoLines = FT(longText, 7, false, W, 2);
          // nowrap: either shrank below 7pt or was truncated with an ellipsis.
          assert("fitText nowrap fits one line (size or truncation)",
            oneLine.sizePt < 7 || oneLine.text.slice(-1) === "…");
          // wrap: the 2-line budget is more generous, so the kept font is at
          // least as large as the one-line result.
          assert("fitText wrap keeps font ≥ nowrap", twoLines.sizePt >= oneLine.sizePt);
          // wrap never char-truncates (the CSS clamp handles overflow); only
          // nowrap produces an ellipsis from fitText.
          assert("fitText wrap keeps full text", twoLines.text === longText);
          // A short string that already fits one line is unchanged by wrap.
          assert("fitText short text unchanged by wrap",
            FT("Hi", 6, false, W, 1).sizePt === FT("Hi", 6, false, W, 2).sizePt);

          // resolveLines carries the per-line `wrap` flag through for both
          // frozen (manual) lines and mapper-driven lines.
          const RL2 = window.PrintLabels.resolveLines;
          const frozenWrap = { lines: [{ text: "x", sizePt: 6, bold: false, wrap: true }], qty: 1, selected: true };
          assert("resolveLines carries wrap on frozen lines", RL2(frozenWrap)[0].wrap === true);
          const S_wrap = window.PrintLabels.state.mapping;
          window.PrintLabels.state.mapping = [
            { path: "name", sizePt: 7, bold: false, literal: "", wrap: true },
            { path: "", sizePt: 6, bold: false, literal: "", wrap: false },
            { path: "", sizePt: 6, bold: false, literal: "", wrap: false },
            { path: "", sizePt: 6, bold: false, literal: "", wrap: false },
          ];
          assert("resolveLines carries wrap on mapped lines",
            RL2({ raw: { name: "Y" } })[0].wrap === true && RL2({ raw: { name: "Y" } })[1].wrap === false);
          window.PrintLabels.state.mapping = S_wrap;

          // Project round-trip
          const Proj = window.PrintLabels.Project;
          const S = window.PrintLabels.state;
          S.items = [{ raw: { plant_name_swedish: "Z" }, qty: 4, selected: true }];
          S.mapping = [
            { path: "plant_name_swedish", sizePt: 8, bold: true, literal: "", wrap: false },
            { path: "", sizePt: 6, bold: false, literal: "", wrap: false },
            { path: "", sizePt: 6, bold: false, literal: "hi", wrap: false },
            { path: "", sizePt: 6, bold: false, literal: "", wrap: false },
          ];
          S.formatId = "4336";
          S.skipN = 7;
          S.grid = true;
          const before = Proj.serialize();
          Proj.load(JSON.parse(JSON.stringify(before)));
          const after = Proj.serialize();
          // exportedAt is a fresh timestamp on every serialize() call; strip it.
          delete before.exportedAt;
          delete after.exportedAt;
          assert("Project serialize→load→serialize round-trips", JSON.stringify(before) === JSON.stringify(after), "state differs after reload");

          summary.textContent = passed + " passed, " + failed + " failed";
          summary.className = failed === 0 ? "pass" : "fail";
        });
      })();
    </script>
  </body>
</html>
